# This is a Databricks asset bundle definition for MLB.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: MLB

include:
  - resources/databricks/*/*.yaml

artifacts:
  default:
    type: whl
    build: python -m build
    path: .

sync:
  exclude:
    - .vscode/
    - .venv/
    - .databricks/
    - doc/
    - notebooks/
    - README.md

targets:
  prod:
    default: true
    workspace:
      host: https://dbc-55357501-eeb1.cloud.databricks.com

    run_as:
      user_name: guillermo.hre@gmail.com

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://dbc-55357501-eeb1.cloud.databricks.com
