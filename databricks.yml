# This is a Databricks asset bundle definition for MLB.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: MLB

include:
  - resources/databricks/**/*.yml

sync:
  exclude:
    - .vscode/
    - .venv/
    - .databricks/
    - docs/
    - documentation/
    - README.md

targets:
  prod:
    default: true
    workspace:
      host: https://dbc-55357501-eeb1.cloud.databricks.com

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://dbc-55357501-eeb1.cloud.databricks.com
