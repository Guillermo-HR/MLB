resources:
  jobs:
    update_schedule:
      name: update_schedule

      schedule:
        quartz_cron_expression: "0 0/15 * * * ?"
        timezone_id: "America/Mexico_City"
        pause_status: UNPAUSED

      timeout_seconds: 120

      run_as:
        service_principal_name: "730f929c-a758-42cf-9a67-30054d560f0b"

      tasks:
        - task_key: ingest_schedule
          spark_python_task:
            python_file: ../../../src/mlb_data/ingestion/schedule.py

          environment_key: Default

      queue:
        enabled: true

      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
            dependencies:
              - ../../../dist/*.whl

      performance_target: PERFORMANCE_OPTIMIZED